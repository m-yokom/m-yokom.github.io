<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myoko</title>
  <meta name="description" content="myokoが個人で開発しているスマートフォン向けアプリの一覧です。">
  <style>
    :root { --bg: #f6f7f9; --surface: #ffffff; --text: #15181f; --sub: #5b6270; --line: #dde1e7; --accent: #2f5fd0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15181f; --surface: #20242c; --text: #eef0f4; --sub: #a3aab8; --line: #333945; --accent: #8fb0ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 32px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .lead { color: var(--sub); margin: 0 0 32px; }
    h2 { font-size: 1rem; color: var(--sub); margin: 0 0 12px; }
    .apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .apps a { display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
    .apps a:hover { border-color: var(--accent); }
    .apps img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
    .apps strong { display: block; font-size: 1.05rem; }
    .apps span { color: var(--sub); font-size: 0.9rem; }
    footer { margin-top: 48px; color: var(--sub); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>myoko</h1>
  <p class="lead">個人で開発しているスマートフォン向けアプリの一覧です。</p>

  <h2>アプリ</h2>
  <ul class="apps">
    <li>
      <a href="ao8/">
        <img src="ao8/assets/icon.png" alt="">
        <div>
          <strong>Apex of 8</strong>
          <span>8種族×8クラスの戦士を育てて頂点を目指す、育成シミュレーションRPG</span>
        </div>
      </a>
    </li>
  </ul>

  <footer>&copy; 2026 myoko</footer>
</main>
</body>
</html>
